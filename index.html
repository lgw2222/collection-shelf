<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Collection — Virtual Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#12131a;
  --bg2:#171923;
  --case:#1c1e29;
  --case-line:#2a2d3c;
  --wood:#4a3323;
  --wood-hi:#6b4a30;
  --wood-lo:#33221610;
  --ink:#ece4d3;
  --ink-dim:#a49c8c;
  --ink-faint:#6f6a5e;
  --gold:#c9a24b;
  --gold-soft:#8a7336;
  --label:#efe7d2;
  --danger:#c46a5a;
  --ok:#6f9c7a;
  --row-h:186px;
  --shelf-gap:40px;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #1d2030 0%, var(--bg) 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Instrument Sans',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* ---------- top bar ---------- */
header{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 20px;
  background:linear-gradient(180deg, rgba(18,19,26,.96), rgba(18,19,26,.78));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--case-line);
}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.brand .mark{
  font-family:'Cinzel',serif;font-weight:700;font-size:22px;letter-spacing:.04em;
  color:var(--label);
}
.brand .mark b{color:var(--gold);font-weight:700}
.brand .sub{color:var(--ink-faint);font-size:12.5px;letter-spacing:.02em}
.searchwrap{position:relative;flex:1 1 220px;max-width:340px}
.searchwrap input{
  width:100%;padding:9px 12px 9px 34px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--case-line);color:var(--ink);font-size:14px;
}
.searchwrap input:focus{outline:none;border-color:var(--gold-soft)}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 14px;border-radius:8px;font-size:14px;font-weight:500;
  background:var(--bg2);color:var(--ink);border:1px solid var(--case-line);
}
.btn:hover{border-color:var(--gold-soft);color:var(--label)}
.btn.primary{background:linear-gradient(180deg,var(--gold),#b28e3c);color:#20180a;border-color:#8a6f2c;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.icon{padding:9px;width:38px;justify-content:center}
.btn.sm{padding:6px 10px;font-size:13px}

/* ---------- stats ---------- */
.stats{
  display:flex;gap:26px;flex-wrap:wrap;
  padding:14px 24px;border-bottom:1px solid var(--case-line);
  background:var(--bg2);
}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat .n{font-family:'Cinzel',serif;font-size:22px;color:var(--label);font-weight:600}
.stat .l{font-size:11.5px;color:var(--ink-faint);letter-spacing:.03em;margin-top:2px}
.stat.value .n{color:var(--gold)}

/* ---------- the case / shelf ---------- */
main{max-width:1240px;margin:0 auto;padding:26px 20px 90px}
.case{
  position:relative;
  border:1px solid var(--case-line);
  border-radius:14px;
  padding:34px 30px 30px;
  background:
    linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,0) 120px),
    var(--case);
  box-shadow:inset 0 2px 30px rgba(0,0,0,.4);
}
.shelf{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  grid-auto-rows:var(--row-h);
  row-gap:var(--shelf-gap);
  column-gap:20px;
  align-items:end;
  /* wooden plank sits in each row-gap, under the boxes */
  background-image:
    repeating-linear-gradient(
      180deg,
      transparent 0,
      transparent var(--row-h),
      #2a1c12 var(--row-h),
      var(--wood) calc(var(--row-h) + 6px),
      var(--wood-hi) calc(var(--row-h) + 20px),
      var(--wood) calc(var(--row-h) + 30px),
      #241811 calc(var(--row-h) + var(--shelf-gap)),
      transparent calc(var(--row-h) + var(--shelf-gap))
    );
  background-position:0 2px;
}
/* subtle grain on planks */
.shelf::after{content:"";position:absolute;inset:0;pointer-events:none}

/* box */
.box{
  position:relative;height:calc(var(--row-h) - 8px);
  border-radius:8px 8px 5px 5px;
  border:none;padding:0;text-align:left;
  color:var(--ink);
  background:var(--boxcolor,#6a4a3a);
  box-shadow:
    0 14px 18px -8px rgba(0,0,0,.6),
    inset 0 2px 0 rgba(255,255,255,.14),
    inset 0 -18px 30px rgba(0,0,0,.28);
  transition:transform .16s ease, box-shadow .16s ease;
  overflow:hidden;
}
.box:hover{transform:translateY(-7px);box-shadow:0 22px 26px -8px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.16)}
.box .lid{
  height:26px;
  background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(0,0,0,.14));
  border-bottom:1px solid rgba(0,0,0,.25);
  position:relative;
}
.box .lid::after{ /* handle notch */
  content:"";position:absolute;left:50%;top:9px;transform:translateX(-50%);
  width:34px;height:6px;border-radius:6px;background:rgba(0,0,0,.28);
}
.box .plate{
  position:absolute;left:12px;right:12px;top:52px;
  background:linear-gradient(180deg,#f3ecd8,#e4d8bd);
  border-radius:4px;padding:10px 10px 9px;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
  border:1px solid #cbbd97;
}
.box .plate .name{
  font-family:'Cinzel',serif;font-weight:600;font-size:14.5px;color:#2a2115;
  line-height:1.15;letter-spacing:.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.box .plate .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.box .plate .count{font-size:12px;color:#6a5a3a;font-weight:600}
.box .plate .val{font-size:11.5px;color:#7a6320;font-weight:600}
.box .spine{
  position:absolute;left:0;top:26px;bottom:0;width:8px;
  background:linear-gradient(90deg, rgba(0,0,0,.32), transparent);
}
.box.add{
  background:transparent;border:1.5px dashed var(--case-line);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
  color:var(--ink-faint);box-shadow:none;
}
.box.add:hover{border-color:var(--gold-soft);color:var(--gold);transform:translateY(-4px)}
.box.add .plus{font-size:30px;font-weight:300;line-height:1;font-family:'Cinzel',serif}
.box.add span{font-size:12.5px}

/* empty state */
.empty{
  text-align:center;padding:70px 20px;color:var(--ink-dim);
}
.empty h2{font-family:'Cinzel',serif;color:var(--label);font-weight:600;font-size:24px;margin:0 0 10px}
.empty p{margin:0 auto 22px;max-width:440px;line-height:1.55;font-size:15px}
.empty .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- overlay / box interior ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(8,9,13,.72);backdrop-filter:blur(3px);
  overflow-y:auto;
}
.overlay.open{display:block}
.sheet{
  max-width:1120px;margin:32px auto;background:var(--bg2);
  border:1px solid var(--case-line);border-radius:14px;overflow:hidden;
  animation:rise .22s cubic-bezier(.2,.7,.3,1);
}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.sheet-head{
  padding:20px 22px;border-bottom:1px solid var(--case-line);
  background:linear-gradient(180deg, var(--boxcolor,#333) -40%, var(--bg2) 70%);
}
.sheet-head .top{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{
  font-family:'Cinzel',serif;font-weight:600;font-size:22px;margin:0;color:var(--label);
  flex:1;line-height:1.2;
}
.sheet-head h2 input{
  font:inherit;color:var(--label);background:transparent;border:none;border-bottom:1px dashed var(--gold-soft);
  width:100%;padding:2px 0;
}
.sheet-head h2 input:focus{outline:none}
.sheet-sub{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;color:var(--ink-dim);font-size:13px}
.sheet-sub b{color:var(--ink);font-weight:600}
.sheet-tools{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding:14px 22px;border-bottom:1px solid var(--case-line);
}
.sheet-tools .searchwrap{max-width:none;flex:1 1 180px}
.sheet-tools select{
  padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--case-line);color:var(--ink);font-size:13px;
}
.swatches{display:flex;gap:6px}
.swatch{width:22px;height:22px;border-radius:5px;border:2px solid transparent}
.swatch.sel{border-color:var(--gold)}

.cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
  gap:16px;padding:22px;
}
.card{
  position:relative;border-radius:9px;overflow:hidden;background:var(--bg);
  border:1px solid var(--case-line);
}
.card .imgwrap{position:relative;aspect-ratio:59/86;background:#0d0e13}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.cardback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;
  background:
    radial-gradient(circle at 50% 42%, #7a5a2e, #4a361c 62%, #2e2211 100%);
}
.cardback .ring{
  width:56px;height:56px;border-radius:50%;border:2px solid rgba(240,220,160,.5);
  display:flex;align-items:center;justify-content:center;color:rgba(240,220,160,.7);
  font-family:'Cinzel',serif;font-size:22px;
}
.card .qty{
  position:absolute;top:6px;right:6px;min-width:24px;height:24px;padding:0 6px;
  border-radius:12px;background:rgba(10,10,14,.86);border:1px solid var(--gold-soft);
  color:var(--gold);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.card .cname{padding:8px 9px;font-size:12px;line-height:1.25;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.card .crow{display:flex;align-items:center;justify-content:space-between;padding:0 9px 9px;gap:6px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--bg2);border:1px solid var(--case-line);border-radius:7px}
.stepper button{background:transparent;border:none;color:var(--ink-dim);width:26px;height:26px;font-size:15px;border-radius:6px}
.stepper button:hover{color:var(--gold)}
.stepper .qn{min-width:22px;text-align:center;font-size:13px;color:var(--ink);font-weight:600}
.card .more{background:transparent;border:none;color:var(--ink-faint);font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.card .more:hover{color:var(--ink)}
.card .price{position:absolute;bottom:52px;left:6px;background:rgba(10,10,14,.82);color:var(--gold);
  font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;display:none}
.showvalue .card .price{display:block}

/* menus / modals */
.menu{
  position:fixed;z-index:80;background:var(--bg2);border:1px solid var(--case-line);
  border-radius:10px;padding:6px;min-width:180px;box-shadow:0 16px 40px rgba(0,0,0,.5);display:none;
}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--ink);
  padding:9px 11px;border-radius:7px;font-size:13.5px}
.menu button:hover{background:var(--bg)}
.menu .sep{height:1px;background:var(--case-line);margin:5px 2px}
.menu .head{font-size:11px;color:var(--ink-faint);padding:6px 11px 3px;letter-spacing:.03em}
.menu button.warn{color:var(--danger)}

.modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;
  background:rgba(8,9,13,.74);backdrop-filter:blur(3px);overflow-y:auto;padding:32px 16px}
.modal.open{display:flex}
.dialog{background:var(--bg2);border:1px solid var(--case-line);border-radius:14px;width:100%;max-width:640px;
  animation:rise .2s ease}
.dialog.wide{max-width:820px}
.dialog h3{font-family:'Cinzel',serif;font-weight:600;font-size:19px;margin:0;color:var(--label)}
.dialog-head{padding:18px 22px;border-bottom:1px solid var(--case-line);display:flex;align-items:center;gap:10px}
.dialog-head .x{margin-left:auto}
.dialog-body{padding:22px}
.dialog-foot{padding:16px 22px;border-top:1px solid var(--case-line);display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px}
.field input,.field select{width:100%;padding:10px 12px;border-radius:8px;background:var(--bg);
  border:1px solid var(--case-line);color:var(--ink);font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold-soft)}
.hint{font-size:12.5px;color:var(--ink-faint);line-height:1.5}

.drop{
  border:1.5px dashed var(--case-line);border-radius:12px;padding:34px 20px;text-align:center;
  color:var(--ink-dim);transition:.15s;cursor:pointer;
}
.drop:hover,.drop.hot{border-color:var(--gold);color:var(--gold);background:rgba(201,162,75,.05)}
.drop .big{font-size:30px;margin-bottom:8px}

.maptable{width:100%;border-collapse:collapse;font-size:13.5px}
.maptable th{text-align:left;color:var(--ink-faint);font-weight:500;font-size:11.5px;padding:6px 8px}
.maptable td{padding:5px 8px;border-top:1px solid var(--case-line)}
.maptable select{width:100%;padding:7px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--case-line);color:var(--ink);font-size:13px}
.maptable .col{color:var(--ink);font-weight:500}
.radio-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.radio-chip{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--case-line);border-radius:9px;font-size:13.5px;color:var(--ink-dim);cursor:pointer}
.radio-chip.sel{border-color:var(--gold-soft);color:var(--ink);background:rgba(201,162,75,.06)}

/* detail view */
.detail{display:flex;gap:22px;flex-wrap:wrap}
.detail .big-img{width:230px;max-width:44vw;border-radius:10px;overflow:hidden;aspect-ratio:59/86;background:#0d0e13;flex:none}
.detail .big-img img{width:100%;height:100%;object-fit:cover}
.detail .info{flex:1;min-width:200px}
.detail .info h3{margin:0 0 4px}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--case-line);font-size:13.5px}
.kv .k{color:var(--ink-faint);width:96px;flex:none}
.kv .v{color:var(--ink)}

/* toast + loading */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;
  background:var(--bg2);border:1px solid var(--case-line);color:var(--ink);
  padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.loadbar{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;z-index:130;transition:width .3s}

.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;border:1px solid var(--case-line);color:var(--ink-dim)}
.muted{color:var(--ink-faint)}
kbd{background:var(--bg);border:1px solid var(--case-line);border-radius:5px;padding:1px 6px;font-size:12px;font-family:inherit}

@media (max-width:600px){
  :root{--row-h:168px}
  .brand .sub{display:none}
  .stats{gap:18px;padding:12px 18px}
  .stat .n{font-size:19px}
  main{padding:16px 12px 80px}
  .case{padding:22px 16px 20px}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">The <b>Collection</b></span>
    <span class="sub">virtual shelf</span>
  </div>
  <div class="searchwrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="globalSearch" placeholder="Search every box…" autocomplete="off">
  </div>
  <button class="btn" id="importBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    Import
  </button>
  <button class="btn icon ghost" id="menuBtn" title="More">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
  </button>
</header>

<div class="stats" id="stats"></div>

<main>
  <div class="case" id="case">
    <div class="shelf" id="shelf"></div>
    <div class="empty" id="empty" style="display:none">
      <h2>The shelf is empty</h2>
      <p>Bring your real collection in from a spreadsheet, or start a box by hand. Every box you make here mirrors one on the shelf back home.</p>
      <div class="row">
        <button class="btn primary" id="emptyImport">Import a spreadsheet</button>
        <button class="btn" id="emptyAdd">Add an empty box</button>
      </div>
    </div>
  </div>
</main>

<!-- box interior overlay -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-head" id="sheetHead">
      <div class="top">
        <h2 id="sheetTitle"></h2>
        <button class="btn ghost icon" id="closeSheet" title="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-sub" id="sheetSub"></div>
    </div>
    <div class="sheet-tools">
      <div class="searchwrap" style="flex:1 1 160px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="boxSearch" placeholder="Find in this box…" autocomplete="off">
      </div>
      <select id="boxSort">
        <option value="name">Sort: Name</option>
        <option value="qtyd">Sort: Most copies</option>
        <option value="qtya">Sort: Fewest copies</option>
        <option value="type">Sort: Type</option>
        <option value="valued">Sort: Value ↓</option>
      </select>
      <div class="swatches" id="boxSwatches"></div>
      <button class="btn sm" id="addCardBtn">+ Card</button>
      <button class="btn sm ghost" id="boxMenuBtn">⋯</button>
    </div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<!-- popover menu -->
<div class="menu" id="popMenu"></div>

<!-- generic modal -->
<div class="modal" id="modal">
  <div class="dialog" id="dialog">
    <div class="dialog-head"><h3 id="dlgTitle"></h3><button class="btn ghost icon x" id="dlgClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="dialog-body" id="dlgBody"></div>
    <div class="dialog-foot" id="dlgFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loadbar" id="loadbar"></div>

<script>
"use strict";
/* =========================================================================
   The Collection — a virtual shelf that mirrors a real Yu-Gi-Oh card collection.
   - Card data from YGOPRODeck (db.ygoprodeck.com), downloaded ONCE and cached
     in IndexedDB. All name-matching happens locally afterward.
   - Your collection (boxes + cards) is saved in this browser (localStorage),
     with JSON export/import for backup or moving between devices.
   ========================================================================= */

const IMG = id => `https://images.ygoprodeck.com/images/cards_small/${id}.jpg`;
const IMG_LG = id => `https://images.ygoprodeck.com/images/cards/${id}.jpg`;
const BOX_COLORS = ['#7a4a3a','#3f5e50','#4a4a6a','#6a5a3a','#5a3a4a','#3a5a6a','#6a4657','#41684a','#5c4a68','#6b5330'];
const STORE_KEY = 'ygo-collection-v1';

/* ---------- tiny helpers ---------- */
const $  = s => document.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const uid = ()=> Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const money = n => '$'+ (n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const norm = s => (s||'').toString().toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
function loadbar(p){const b=$('#loadbar');if(p<=0){b.style.width='0';return;}b.style.width=Math.min(100,p*100)+'%';if(p>=1)setTimeout(()=>b.style.width='0',400);}

/* ---------- state ---------- */
let state = { boxes:[], settings:{ showValue:true } };
function load(){ try{const s=JSON.parse(localStorage.getItem(STORE_KEY)); if(s&&s.boxes)state=Object.assign(state,s);}catch(e){} }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* =========================================================================
   Card database (IndexedDB) + local matching
   ========================================================================= */
let cardIndex = null;   // Map: normalizedName -> slim card
let idIndex   = null;   // Map: id -> slim card
let dbReady   = false;

function idb(){ return new Promise((res,rej)=>{const r=indexedDB.open('ygoCardDB',1);
  r.onupgradeneeded=e=>{const db=e.target.result; if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');};
  r.onsuccess=e=>res(e.target.result); r.onerror=()=>rej(r.error);});}
function idbGet(k){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);}));}
function idbSet(k,v){return idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);}));}

function buildIndex(slim){
  cardIndex=new Map(); idIndex=new Map();
  for(const c of slim){ if(!cardIndex.has(c.n)) cardIndex.set(c.n,c); idIndex.set(c.i,c); }
  dbReady=true;
}

async function ensureCardDB(){
  if(dbReady) return true;
  // try cache first
  try{
    const cached = await idbGet('cards');
    if(cached && cached.length){ buildIndex(cached); }
  }catch(e){}
  // check remote version; download if new or missing
  try{
    let remoteVer=null;
    try{ const v=await fetch('https://db.ygoprodeck.com/api/v7/checkDBVer.php').then(r=>r.json()); remoteVer=v&&v[0]&&v[0].database_version; }catch(e){}
    const localVer = await idbGet('ver').catch(()=>null);
    if(dbReady && (!remoteVer || remoteVer===localVer)) return true; // cache good enough

    toast('Downloading card database (one time)…');
    loadbar(0.15);
    const data = await fetch('https://db.ygoprodeck.com/api/v7/cardinfo.php').then(r=>r.json());
    loadbar(0.7);
    if(!data || !data.data) throw new Error('bad response');
    const slim = data.data.map(c=>{
      let p=0; const pr=c.card_prices&&c.card_prices[0];
      if(pr) p = parseFloat(pr.tcgplayer_price)||parseFloat(pr.cardmarket_price)||parseFloat(pr.ebay_price)||0;
      return { i:(c.card_images&&c.card_images[0]&&c.card_images[0].id)||c.id, n:norm(c.name), dn:c.name, t:c.type, r:c.race, a:c.attribute, p };
    });
    buildIndex(slim);
    await idbSet('cards', slim);
    if(remoteVer) await idbSet('ver', remoteVer);
    loadbar(1);
    return true;
  }catch(e){
    loadbar(1);
    if(dbReady) return true; // we still have a cache, that's fine
    toast('Could not reach the card database — cards will show as labels for now.');
    return false;
  }
}

/* resolve a card name (or passcode id) to a slim record */
function resolveByName(name){
  if(!cardIndex) return null;
  const q=norm(name); if(!q) return null;
  if(cardIndex.has(q)) return cardIndex.get(q);
  const noParen=q.replace(/\s*\([^)]*\)\s*/g,' ').trim();
  if(noParen && cardIndex.has(noParen)) return cardIndex.get(noParen);
  // last resort: startsWith scan (cheap enough, cached by caller)
  for(const [k,v] of cardIndex){ if(k.startsWith(q) || q.startsWith(k)) return v; }
  return null;
}
function resolveById(id){ id=parseInt(id,10); return idIndex&&idIndex.has(id)?idIndex.get(id):null; }

/* attach resolved data (id, type, price...) to a card object */
function enrich(card){
  let rec=null;
  if(card.cardId) rec=resolveById(card.cardId);
  if(!rec && card.name) rec=resolveByName(card.name);
  if(rec){ card.cardId=rec.i; card.type=rec.t; card.race=rec.r; card.attribute=rec.a; card.price=rec.p; if(rec.dn && !card.name) card.name=rec.dn; }
  return card;
}
async function enrichAll(){
  await ensureCardDB();
  if(!dbReady) return;
  for(const b of state.boxes) for(const c of b.cards) enrich(c);
  save();
}

/* =========================================================================
   Rendering — the shelf
   ========================================================================= */
function boxTotals(b){
  let count=0,value=0;
  for(const c of b.cards){ const q=c.qty||1; count+=q; value+=(c.price||0)*q; }
  return {count,value,unique:b.cards.length};
}
function grandTotals(){
  let cards=0,unique=0,value=0;
  for(const b of state.boxes){ const t=boxTotals(b); cards+=t.count; unique+=t.unique; value+=t.value; }
  return {cards,unique,value,boxes:state.boxes.length};
}

function renderStats(){
  const g=grandTotals();
  const items=[
    ['n', g.cards.toLocaleString(), 'cards'],
    ['n', g.unique.toLocaleString(), 'unique'],
    ['n', g.boxes.toLocaleString(), 'boxes'],
  ];
  if(state.settings.showValue) items.push(['value', money(g.value), 'est. value']);
  const c=$('#stats'); c.innerHTML='';
  for(const [cls,n,l] of items){
    const s=el('div','stat'+(cls==='value'?' value':''));
    s.append(el('span','n',n), el('span','l',l));
    c.appendChild(s);
  }
}

function renderShelf(){
  const shelf=$('#shelf'), empty=$('#empty');
  shelf.innerHTML='';
  if(state.boxes.length===0){ empty.style.display='block'; renderStats(); return; }
  empty.style.display='none';
  for(const b of state.boxes){
    const t=boxTotals(b);
    const box=el('button','box');
    box.style.setProperty('--boxcolor', b.color||'#6a4a3a');
    box.innerHTML=`
      <div class="lid"></div><div class="spine"></div>
      <div class="plate">
        <div class="name">${escapeHtml(b.name)}</div>
        <div class="meta">
          <span class="count">${t.count} ${t.count===1?'card':'cards'}</span>
          ${state.settings.showValue&&t.value?`<span class="val">${money(t.value)}</span>`:''}
        </div>
      </div>`;
    box.onclick=()=>openBox(b.id);
    shelf.appendChild(box);
  }
  const add=el('button','box add');
  add.innerHTML=`<span class="plus">+</span><span>New box</span>`;
  add.onclick=()=>newBoxDialog();
  shelf.appendChild(add);
  renderStats();
}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* =========================================================================
   Box interior
   ========================================================================= */
let currentBoxId=null;
function getBox(id){ return state.boxes.find(b=>b.id===id); }

function openBox(id){
  currentBoxId=id;
  const b=getBox(id); if(!b) return;
  $('#sheetHead').style.setProperty('--boxcolor', b.color||'#333');
  $('#boxSearch').value=''; 
  renderBoxHeader(); renderSwatches(); renderCards();
  const ov=$('#overlay'); ov.classList.add('open'); document.body.style.overflow='hidden';
  $('#sheet').scrollTop=0; ov.scrollTop=0;
}
function closeBox(){ $('#overlay').classList.remove('open'); document.body.style.overflow=''; currentBoxId=null; }

function renderBoxHeader(){
  const b=getBox(currentBoxId); if(!b)return;
  const t=boxTotals(b);
  $('#sheetTitle').innerHTML=`<input id="boxNameInput" value="${escapeHtml(b.name)}">`;
  const input=$('#boxNameInput');
  input.onchange=()=>{ b.name=input.value.trim()||'Untitled box'; save(); renderShelf(); };
  input.onkeydown=e=>{ if(e.key==='Enter')input.blur(); };
  const sub=$('#sheetSub'); sub.innerHTML='';
  sub.append(kv(`<b>${t.count}</b> cards`), kv(`<b>${t.unique}</b> unique`));
  if(state.settings.showValue) sub.append(kv(`<b>${money(t.value)}</b> est. value`));
}
function kv(html){const s=el('span');s.innerHTML=html;return s;}

function renderSwatches(){
  const b=getBox(currentBoxId); const wrap=$('#boxSwatches'); wrap.innerHTML='';
  for(const col of BOX_COLORS){
    const s=el('button','swatch'+(b.color===col?' sel':'')); s.style.background=col;
    s.onclick=()=>{ b.color=col; save(); renderSwatches(); renderShelf();
      $('#sheetHead').style.setProperty('--boxcolor',col); };
    wrap.appendChild(s);
  }
}

function sortedCards(b){
  const mode=$('#boxSort').value;
  const q=norm($('#boxSearch').value);
  let list=b.cards.slice();
  if(q) list=list.filter(c=>norm(c.name).includes(q) || norm(c.setCode).includes(q) || norm(c.rarity).includes(q));
  const by={
    name:(a,b)=>(a.name||'').localeCompare(b.name||''),
    qtyd:(a,b)=>(b.qty||1)-(a.qty||1),
    qtya:(a,b)=>(a.qty||1)-(b.qty||1),
    type:(a,b)=>(a.type||'zz').localeCompare(b.type||'zz')||(a.name||'').localeCompare(b.name||''),
    valued:(a,b)=>((b.price||0)*(b.qty||1))-((a.price||0)*(a.qty||1)),
  }[mode]||((a,b)=>0);
  return list.sort(by);
}

function renderCards(){
  const b=getBox(currentBoxId); if(!b)return;
  const wrap=$('#cards'); wrap.innerHTML='';
  wrap.classList.toggle('showvalue', !!state.settings.showValue);
  const list=sortedCards(b);
  if(list.length===0){
    const e=el('div'); e.style.cssText='grid-column:1/-1;text-align:center;color:var(--ink-faint);padding:40px';
    e.innerHTML = b.cards.length===0
      ? 'This box is empty. Use <b>+ Card</b> to add one, or move cards here from another box.'
      : 'Nothing matches your search.';
    wrap.appendChild(e); return;
  }
  for(const c of list){
    const card=el('div','card');
    const img = c.cardId
      ? `<img loading="lazy" src="${IMG(c.cardId)}" alt="${escapeHtml(c.name)}" onerror="this.parentNode.innerHTML='&lt;div class=cardback&gt;&lt;div class=ring&gt;◆&lt;/div&gt;&lt;/div&gt;'">`
      : `<div class="cardback"><div class="ring">◆</div></div>`;
    const price = (c.price? `<div class="price">${money(c.price)}</div>`:'');
    card.innerHTML=`
      <div class="imgwrap">${img}<span class="qty">×${c.qty||1}</span>${price}</div>
      <div class="cname">${escapeHtml(c.name||'Unknown card')}</div>
      <div class="crow">
        <div class="stepper">
          <button data-a="dec">−</button><span class="qn">${c.qty||1}</span><button data-a="inc">+</button>
        </div>
        <button class="more" data-a="more">⋯</button>
      </div>`;
    card.querySelector('[data-a=inc]').onclick=()=>{c.qty=(c.qty||1)+1;save();renderCards();renderBoxHeader();renderStats();renderShelf();};
    card.querySelector('[data-a=dec]').onclick=()=>{c.qty=(c.qty||1)-1; if(c.qty<=0){removeCard(c);} else{save();renderCards();renderBoxHeader();renderStats();renderShelf();}};
    card.querySelector('[data-a=more]').onclick=(e)=>cardMenu(e,c);
    card.querySelector('.imgwrap').onclick=()=>cardDetail(c);
    wrap.appendChild(card);
  }
}
function removeCard(c){
  const b=getBox(currentBoxId); b.cards=b.cards.filter(x=>x!==c);
  save();renderCards();renderBoxHeader();renderStats();renderShelf();
}

/* card ⋯ menu: move / detail / delete */
function cardMenu(e,c){
  e.stopPropagation();
  const items=[{head:'Move to box'}];
  for(const b of state.boxes){ if(b.id!==currentBoxId) items.push({label:b.name, fn:()=>moveCard(c,b.id)}); }
  items.push({label:'＋ New box…', fn:()=>{ const name=prompt('New box name:'); if(name){const nb=makeBox(name); moveCard(c,nb.id);} }});
  items.push({sep:true});
  items.push({label:'View card', fn:()=>cardDetail(c)});
  items.push({label:'Remove from box', warn:true, fn:()=>removeCard(c)});
  showMenu(e.clientX,e.clientY,items);
}
function moveCard(c,toId){
  const from=getBox(currentBoxId), to=getBox(toId);
  from.cards=from.cards.filter(x=>x!==c);
  // merge with same card in target
  const match=to.cards.find(x=>(x.cardId&&x.cardId===c.cardId)||(norm(x.name)===norm(c.name)&&x.setCode===c.setCode));
  if(match) match.qty=(match.qty||1)+(c.qty||1); else to.cards.push(c);
  save(); renderCards(); renderBoxHeader(); renderStats(); renderShelf();
  toast(`Moved to “${to.name}”`);
}

function cardDetail(c){
  openModal('Card', dlg=>{
    const d=el('div','detail');
    const imgHtml = c.cardId? `<img src="${IMG_LG(c.cardId)}" onerror="this.style.display='none'">` : `<div class="cardback"><div class="ring">◆</div></div>`;
    const img=el('div','big-img'); img.innerHTML=imgHtml;
    const info=el('div','info');
    info.innerHTML=`<h3 style="font-family:'Cinzel',serif">${escapeHtml(c.name||'Unknown card')}</h3>`;
    const rows=[
      ['Copies', c.qty||1],
      ['Type', c.type||'—'],
      ['Attribute/Race', [c.attribute,c.race].filter(Boolean).join(' · ')||'—'],
      ['Set', c.setCode||'—'],
      ['Rarity', c.rarity||'—'],
      ['Condition', c.condition||'—'],
      ['Est. value (each)', c.price?money(c.price):'—'],
      ['Est. value (total)', c.price?money(c.price*(c.qty||1)):'—'],
    ];
    for(const [k,v] of rows){ const r=el('div','kv'); r.append(el('span','k',k),el('span','v',String(v))); info.appendChild(r); }
    d.append(img,info); dlg.body.appendChild(d);
  },[{label:'Close',cls:'primary',fn:closeModal}]);
}

/* box ⋯ menu */
function boxOptionsMenu(e){
  const b=getBox(currentBoxId);
  showMenu(e.clientX,e.clientY,[
    {label:'Rename box', fn:()=>{$('#boxNameInput').focus();$('#boxNameInput').select();}},
    {label:'Export this box (CSV)', fn:()=>exportCSV(b)},
    {sep:true},
    {label:'Delete box', warn:true, fn:()=>{
      if(confirm(`Delete “${b.name}” and its ${boxTotals(b).count} cards from the virtual shelf? (Your real cards are safe.)`)){
        state.boxes=state.boxes.filter(x=>x.id!==b.id); save(); closeBox(); renderShelf();
      }
    }},
  ]);
}

/* =========================================================================
   Popover menu
   ========================================================================= */
function showMenu(x,y,items){
  const m=$('#popMenu'); m.innerHTML='';
  for(const it of items){
    if(it.sep){m.appendChild(el('div','sep'));continue;}
    if(it.head){m.appendChild(el('div','head',it.head));continue;}
    const b=el('button',it.warn?'warn':null,it.label);
    b.onclick=()=>{closeMenu(); it.fn&&it.fn();};
    m.appendChild(b);
  }
  m.style.left=Math.min(x, innerWidth-200)+'px';
  m.style.top=Math.min(y, innerHeight-Math.min(items.length*40+20,320))+'px';
  m.classList.add('open');
}
function closeMenu(){$('#popMenu').classList.remove('open');}
document.addEventListener('click',e=>{ if(!$('#popMenu').contains(e.target)) closeMenu(); });

/* =========================================================================
   Boxes: create / add card
   ========================================================================= */
function makeBox(name,color){
  const b={id:uid(),name:name||'New box',color:color||BOX_COLORS[state.boxes.length%BOX_COLORS.length],cards:[]};
  state.boxes.push(b); save(); renderShelf(); return b;
}
function newBoxDialog(){
  openModal('New box', ({body})=>{
    body.innerHTML=`<div class="field"><label>Box name</label><input id="nbName" placeholder="e.g. Blue-Eyes binder, Bulk commons, Deck box #3"></div>
      <div class="hint">Give it the same name you use in real life so the shelf feels familiar.</div>`;
    setTimeout(()=>$('#nbName').focus(),50);
    $('#nbName').onkeydown=e=>{if(e.key==='Enter')doIt();};
    function doIt(){const n=$('#nbName').value.trim(); if(!n)return; const b=makeBox(n); closeModal(); openBox(b.id);}
    body._doIt=doIt;
  },[{label:'Cancel',fn:closeModal},{label:'Create box',cls:'primary',fn:()=>$('#dlgBody')._doIt()}]);
}

function addCardDialog(){
  openModal('Add a card', ({body})=>{
    body.innerHTML=`
      <div class="field"><label>Card name</label><input id="acName" list="acList" placeholder="Start typing…" autocomplete="off"><datalist id="acList"></datalist></div>
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:120px"><label>Copies</label><input id="acQty" type="number" min="1" value="1"></div>
        <div class="field" style="flex:1;min-width:120px"><label>Set code (optional)</label><input id="acSet" placeholder="LOB-001"></div>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:120px"><label>Rarity (optional)</label><input id="acRarity"></div>
        <div class="field" style="flex:1;min-width:120px"><label>Condition (optional)</label><input id="acCond" placeholder="NM / LP / …"></div>
      </div>
      <div class="hint" id="acHint"></div>`;
    setTimeout(()=>$('#acName').focus(),50);
    const input=$('#acName'), list=$('#acList'), hint=$('#acHint');
    input.oninput=()=>{
      const q=norm(input.value); list.innerHTML='';
      if(dbReady && q.length>=2){
        let n=0; for(const [k,v] of cardIndex){ if(k.includes(q)){ const o=el('option'); o.value=v.dn; list.appendChild(o); if(++n>=12)break; } }
      }
      const rec=resolveByName(input.value);
      hint.innerHTML = rec? `Matched: <b>${escapeHtml(rec.dn)}</b> · ${rec.t||''} ${rec.p?('· '+money(rec.p)):''}` : (input.value?'No exact match yet — it will still be saved as a label.':'');
    };
    body._doIt=()=>{
      const name=input.value.trim(); if(!name)return;
      const b=getBox(currentBoxId);
      const card=enrich({name, qty:Math.max(1,parseInt($('#acQty').value)||1), setCode:$('#acSet').value.trim(), rarity:$('#acRarity').value.trim(), condition:$('#acCond').value.trim()});
      const match=b.cards.find(x=>(x.cardId&&x.cardId===card.cardId)||(norm(x.name)===norm(card.name)&&x.setCode===card.setCode));
      if(match) match.qty=(match.qty||1)+card.qty; else b.cards.push(card);
      save(); closeModal(); renderCards(); renderBoxHeader(); renderStats(); renderShelf();
    };
  },[{label:'Cancel',fn:closeModal},{label:'Add card',cls:'primary',fn:()=>$('#dlgBody')._doIt()}]);
}

/* =========================================================================
   Import from CSV / Excel
   ========================================================================= */
const FIELD_DEFS=[
  {key:'name',    label:'Card name',   match:/^(card ?name|name|card|title)$/i, alt:/name|card|title/i, required:true},
  {key:'qty',     label:'Quantity',    match:/^(qty|quantity|count|copies|amount|owned|have|#)$/i, alt:/qty|quant|count|cop|amount|owned|have|number/i},
  {key:'box',     label:'Box / location', match:/^(box|location|bin|binder|folder|storage|shelf|slot|place)$/i, alt:/box|location|bin|binder|folder|storage|shelf|slot|where|place/i},
  {key:'cardId',  label:'Passcode / ID', match:/^(passcode|password|id|card ?id|konami ?id)$/i, alt:/passcode|password|konami/i},
  {key:'setCode', label:'Set code',    match:/^(set ?code|code|number|card ?number)$/i, alt:/set ?code|^code$/i},
  {key:'set',     label:'Set name',    match:/^(set|set ?name|edition|expansion)$/i, alt:/set ?name|edition|expansion/i},
  {key:'rarity',  label:'Rarity',      match:/^(rarity|rare)$/i, alt:/rarity|rare/i},
  {key:'condition',label:'Condition',  match:/^(condition|cond|grade|quality)$/i, alt:/condition|cond|grade|quality/i},
];

function importDialog(){
  openModal('Import your collection', ({body})=>{
    body.innerHTML=`
      <div class="drop" id="drop">
        <div class="big">📄</div>
        <div><b>Drop a CSV or Excel file here</b>, or tap to choose</div>
        <div class="hint" style="margin-top:6px">Whatever columns your sheet has, you'll get to line them up on the next step.</div>
        <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.tsv" style="display:none">
      </div>`;
    const drop=$('#drop'), fi=$('#fileInput');
    drop.onclick=()=>fi.click();
    fi.onchange=()=>fi.files[0]&&readFile(fi.files[0]);
    ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot');}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot');}));
    drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f)readFile(f); });
  },[{label:'Cancel',fn:closeModal}]);
}

function readFile(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.csv')||name.endsWith('.tsv')){
    Papa.parse(file,{header:true,skipEmptyLines:true,complete:r=>mappingStep(r.meta.fields||[], r.data)});
  }else{
    const reader=new FileReader();
    reader.onload=e=>{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      const headers=rows.length?Object.keys(rows[0]):[];
      mappingStep(headers, rows);
    };
    reader.readAsArrayBuffer(file);
  }
}

function autoMap(headers){
  const map={};
  const used=new Set();
  for(const def of FIELD_DEFS){
    let hit=headers.find(h=>def.match.test((h||'').trim()) && !used.has(h));
    if(!hit && def.alt) hit=headers.find(h=>def.alt.test((h||'').trim()) && !used.has(h));
    if(hit){ map[def.key]=hit; used.add(hit); }
  }
  return map;
}

function mappingStep(headers, rows){
  headers=headers.filter(h=>h!=null && h!=='');
  if(!headers.length){ toast('That file had no columns I could read.'); return; }
  const map=autoMap(headers);
  openModal('Match your columns', ({body})=>{
    $('#dialog').classList.add('wide');
    let html=`<p class="hint" style="margin-top:0">Found <b>${rows.length}</b> rows and <b>${headers.length}</b> columns. Line up what's what — I've guessed where I could.</p>
      <table class="maptable"><thead><tr><th>What it is</th><th>Your column</th></tr></thead><tbody>`;
    for(const def of FIELD_DEFS){
      html+=`<tr><td class="col">${def.label}${def.required?' <span style="color:var(--gold)">*</span>':''}</td>
        <td><select data-k="${def.key}"><option value="">— none —</option>${
          headers.map(h=>`<option value="${escapeHtml(h)}" ${map[def.key]===h?'selected':''}>${escapeHtml(h)}</option>`).join('')
        }</select></td></tr>`;
    }
    html+=`</tbody></table>
      <div class="field" style="margin-top:20px"><label>How should these become boxes?</label>
      <div class="radio-row" id="groupMode">
        <label class="radio-chip sel" data-m="auto"><input type="radio" name="gm" checked style="display:none">Use the “Box / location” column</label>
        <label class="radio-chip" data-m="one"><input type="radio" name="gm" style="display:none">Put everything in one new box</label>
      </div></div>
      <div class="field" id="oneBoxField" style="display:none"><label>New box name</label><input id="oneBoxName" value="Imported collection"></div>
      <div class="hint" id="mapNote"></div>`;
    body.innerHTML=html;

    const groupSel=()=>document.querySelector('#groupMode .radio-chip.sel').dataset.m;
    document.querySelectorAll('#groupMode .radio-chip').forEach(chip=>{
      chip.onclick=()=>{ document.querySelectorAll('#groupMode .radio-chip').forEach(c=>c.classList.remove('sel')); chip.classList.add('sel');
        $('#oneBoxField').style.display = chip.dataset.m==='one'?'block':'none'; syncNote(); };
    });
    function syncNote(){
      const boxCol=body.querySelector('[data-k=box]').value;
      const note=$('#mapNote');
      if(groupSel()==='auto' && !boxCol) note.innerHTML='⚠ No box column selected — pick one above, or switch to “one new box.”';
      else note.innerHTML='';
    }
    body.querySelector('[data-k=box]').onchange=syncNote;
    syncNote();

    body._doImport=()=>{
      const sel={};
      body.querySelectorAll('select[data-k]').forEach(s=>{ if(s.value)sel[s.key=s.dataset.k]=s.value; });
      // build map key->column
      const cols={}; body.querySelectorAll('select[data-k]').forEach(s=>{ if(s.value)cols[s.dataset.k]=s.value; });
      if(!cols.name){ toast('Please choose which column is the card name.'); return; }
      const mode=groupSel();
      if(mode==='auto' && !cols.box){ toast('Pick a box column, or choose “one new box.”'); return; }
      doImport(rows, cols, mode, mode==='one'?($('#oneBoxName').value.trim()||'Imported collection'):null);
    };
  },[{label:'Back',fn:importDialog},{label:'Import',cls:'primary',fn:()=>$('#dlgBody')._doImport()}]);
}

async function doImport(rows, cols, mode, oneBoxName){
  closeModal();
  await ensureCardDB();
  const getBoxByName=name=>{
    let b=state.boxes.find(x=>norm(x.name)===norm(name));
    if(!b) b=makeBox(name);
    return b;
  };
  let added=0, imported=0;
  const targetOne = mode==='one'? getBoxByName(oneBoxName) : null;
  for(const row of rows){
    const name=(row[cols.name]||'').toString().trim();
    if(!name) continue;
    const boxName = mode==='one' ? oneBoxName : ((row[cols.box]||'').toString().trim()||'Unsorted');
    const box = mode==='one' ? targetOne : getBoxByName(boxName);
    let qty=1; if(cols.qty){ const q=parseInt((row[cols.qty]||'').toString().replace(/[^0-9-]/g,''),10); if(!isNaN(q)&&q>0)qty=q; }
    const card=enrich({
      name, qty,
      cardId: cols.cardId? parseInt((row[cols.cardId]||'').toString().replace(/[^0-9]/g,''),10)||null : null,
      setCode: cols.setCode? (row[cols.setCode]||'').toString().trim() : '',
      rarity: cols.rarity? (row[cols.rarity]||'').toString().trim() : '',
      condition: cols.condition? (row[cols.condition]||'').toString().trim() : '',
    });
    const match=box.cards.find(x=>(x.cardId&&card.cardId&&x.cardId===card.cardId&&x.setCode===card.setCode)||(norm(x.name)===norm(card.name)&&x.setCode===card.setCode));
    if(match) match.qty=(match.qty||1)+qty; else { box.cards.push(card); }
    imported+=qty; added++;
  }
  save(); renderShelf();
  toast(`Imported ${added} entries (${imported} cards) into ${mode==='one'?1:state.boxes.length} box${(mode==='one')?'':'es'}.`);
}

/* =========================================================================
   Export / backup
   ========================================================================= */
function download(filename, text, type){
  const blob=new Blob([text],{type:type||'text/plain'});
  const a=el('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportJSON(){ download('collection-backup.json', JSON.stringify(state,null,2),'application/json'); toast('Backup saved.'); }
function importJSON(){
  const fi=el('input'); fi.type='file'; fi.accept='.json';
  fi.onchange=()=>{ const f=fi.files[0]; if(!f)return; const r=new FileReader();
    r.onload=e=>{ try{ const s=JSON.parse(e.target.result); if(s&&s.boxes){ state=Object.assign({settings:{showValue:true}},s); save(); enrichAll().then(renderShelf); renderShelf(); toast('Collection restored.'); } }catch(err){ toast('That file was not a valid backup.'); } };
    r.readAsText(f); };
  fi.click();
}
function exportCSV(box){
  const boxes = box? [box] : state.boxes;
  const rows=[['Box','Card name','Quantity','Set code','Rarity','Condition','Passcode','Est. value each']];
  for(const b of boxes) for(const c of b.cards)
    rows.push([b.name, c.name||'', c.qty||1, c.setCode||'', c.rarity||'', c.condition||'', c.cardId||'', c.price||'']);
  const csv=rows.map(r=>r.map(v=>{v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');
  download((box?box.name.replace(/[^\w]+/g,'-'):'full-collection')+'.csv', csv,'text/csv');
  toast('CSV exported.');
}

/* =========================================================================
   Global search across every box
   ========================================================================= */
function globalSearch(q){
  q=norm(q); if(!q){ return; }
  const results=[];
  for(const b of state.boxes) for(const c of b.cards)
    if(norm(c.name).includes(q)||norm(c.setCode).includes(q)) results.push({box:b,card:c});
  openModal(`Search: “${q}”`, ({body})=>{
    if(!results.length){ body.innerHTML='<p class="muted">No cards match that.</p>'; return; }
    body.innerHTML=`<p class="hint" style="margin-top:0">${results.length} match${results.length===1?'':'es'} across your shelf.</p>`;
    const grid=el('div','cards'); grid.style.padding='0'; grid.classList.toggle('showvalue',!!state.settings.showValue);
    for(const {box,card:c} of results.slice(0,120)){
      const card=el('div','card');
      const img=c.cardId?`<img loading="lazy" src="${IMG(c.cardId)}" onerror="this.parentNode.innerHTML='&lt;div class=cardback&gt;&lt;div class=ring&gt;◆&lt;/div&gt;&lt;/div&gt;'">`:`<div class="cardback"><div class="ring">◆</div></div>`;
      card.innerHTML=`<div class="imgwrap">${img}<span class="qty">×${c.qty||1}</span></div>
        <div class="cname">${escapeHtml(c.name)}</div>
        <div class="crow"><span class="tag">${escapeHtml(box.name)}</span></div>`;
      card.onclick=()=>{ closeModal(); openBox(box.id); };
      grid.appendChild(card);
    }
    body.appendChild(grid);
  },[{label:'Close',fn:closeModal}]);
}

/* =========================================================================
   App menu (top-right ⋯)
   ========================================================================= */
function appMenu(e){
  showMenu(e.clientX,e.clientY,[
    {label:'Import spreadsheet…', fn:importDialog},
    {label:'Add empty box…', fn:newBoxDialog},
    {sep:true},
    {label:'Export full collection (CSV)', fn:()=>exportCSV()},
    {label:'Save backup (JSON)', fn:exportJSON},
    {label:'Restore backup (JSON)', fn:importJSON},
    {sep:true},
    {label:(state.settings.showValue?'Hide':'Show')+' estimated value', fn:()=>{state.settings.showValue=!state.settings.showValue;save();renderShelf();if(currentBoxId){renderBoxHeader();renderCards();}}},
    {label:'Refresh card database', fn:async()=>{ dbReady=false; await idbSet('ver',null); await ensureCardDB(); await enrichAll(); renderShelf(); if(currentBoxId)renderCards(); toast('Card database refreshed.'); }},
  ]);
}

   Wire up
   ========================================================================= */
$('#importBtn').onclick=importDialog;
$('#emptyImport').onclick=importDialog;
$('#emptyAdd').onclick=newBoxDialog;

$('#overlay').addEventListener('click',e=>{ if(e.target===$('#overlay')) closeBox(); });

$('#boxSort').onchange=renderCards;
let gsTimer;
$('#globalSearch').addEventListener('keydown',e=>{ if(e.key==='Enter'){ globalSearch(e.target.value); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#modal').classList.contains('open'))closeModal(); else if($('#overlay').classList.contains('open'))closeBox(); closeMenu(); } });

/* boot */
load();
renderShelf();
// warm the card DB in the background and enrich anything already saved
ensureCardDB().then(()=>{ if(state.boxes.length) enrichAll().then(()=>{renderShelf(); if(currentBoxId)renderCards();}); });
</script>
