<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nick's Collection — Card Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#20204a;
  --ink2:#3a3a6e;
  --paper:#f4f4e4;
  --paper-sh:#c9c9b0;
  --wood:#7a4a2a;
  --wood-d:#5a3418;
  --red:#d8483a;
  --blue:#3b6ea5;
  --gold:#e6b422;
  --green:#3f8a4a;
  --bg:#0e1020;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;
  font-family:'VT323',monospace;color:var(--ink);
  -webkit-font-smoothing:none;image-rendering:pixelated;
  -webkit-tap-highlight-color:transparent;user-select:none;}
.pixel{font-family:'Press Start 2P',monospace}

/* ---------- game stage ---------- */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(45deg,#0e1020,#0e1020 8px,#111428 8px,#111428 16px);}
#screen{position:relative;image-rendering:pixelated;
  box-shadow:0 0 0 6px #202038, 0 0 0 10px #0a0a16, 0 10px 40px rgba(0,0,0,.6);}
#game{display:block;image-rendering:pixelated;background:#000}

/* HUD title */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:5px 8px;font-family:'Press Start 2P';font-size:7px;color:#f4f4e4;
  text-shadow:1px 1px 0 #000;pointer-events:none;z-index:5}
#hud .r{opacity:.85}

/* prompt bubble */
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;z-index:6;
  font-family:'Press Start 2P';font-size:7px;color:var(--ink);background:var(--paper);
  padding:6px 9px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:none;white-space:nowrap}

/* ---------- on-screen controls ---------- */
#controls{position:fixed;bottom:0;left:0;right:0;z-index:10;
  display:flex;justify-content:space-between;align-items:flex-end;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  pointer-events:none}
#controls.hide{display:none}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);pointer-events:auto}
.dpad button{background:#2a2a44;border:2px solid #12122a;color:#c9c9e8;font-size:20px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #12122a}
.dpad button:active{transform:translateY(2px);box-shadow:0 1px 0 #12122a}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.dpad .c{grid-area:2/2;background:#1a1a30;border:none}
.abbtns{display:flex;gap:14px;align-items:center;pointer-events:auto}
.abbtns button{width:54px;height:54px;border-radius:50%;font-family:'Press Start 2P';font-size:13px;
  border:3px solid #12122a;box-shadow:0 4px 0 #12122a}
.abbtns .a{background:var(--red);color:#fff}
.abbtns .b{background:#e8e8f0;color:var(--ink);width:46px;height:46px;font-size:11px}
.abbtns button:active{transform:translateY(3px);box-shadow:0 1px 0 #12122a}

/* ---------- retro windows / overlays ---------- */
.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:flex-start;justify-content:center;
  background:rgba(6,7,16,.72);overflow-y:auto;padding:18px 12px 40px}
.overlay.open{display:flex}
.win{width:100%;max-width:760px;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink),6px 8px 0 rgba(0,0,0,.4);
  margin-top:8px}
.win.sm{max-width:460px}
.win-title{font-family:'Press Start 2P';font-size:11px;padding:12px 14px;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;gap:10px}
.win-title .sp{margin-left:auto;display:flex;gap:8px}
.win-body{padding:16px}
.win-foot{padding:12px 16px;border-top:3px solid var(--paper-sh);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.rbtn{font-family:'Press Start 2P';font-size:9px;padding:9px 12px;background:var(--paper);color:var(--ink);
  border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;line-height:1.4}
.rbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.rbtn.red{background:var(--red);color:#fff}
.rbtn.blue{background:var(--blue);color:#fff}
.rbtn.gold{background:var(--gold)}
.rbtn.sm{font-size:8px;padding:7px 9px}
.rbtn.x{padding:6px 9px}

.stat-strip{display:flex;gap:16px;flex-wrap:wrap;font-family:'Press Start 2P';font-size:8px;margin-bottom:14px;color:var(--ink2)}
.stat-strip b{color:var(--ink);font-size:11px;display:block;margin-top:4px}

/* shelf overlay: wooden bookcase of boxes */
.bookcase{background:
    linear-gradient(180deg,var(--wood-d),var(--wood));
  border:4px solid var(--wood-d);padding:14px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;
  background-image:repeating-linear-gradient(180deg,transparent,transparent 154px,rgba(0,0,0,.35) 154px,rgba(0,0,0,.35) 170px);}
.vbox{position:relative;height:138px;cursor:pointer;border:2px solid rgba(0,0,0,.4);
  background:var(--bxc,#6a4a3a);box-shadow:inset 0 3px 0 rgba(255,255,255,.18),inset 0 -14px 20px rgba(0,0,0,.3),0 6px 0 rgba(0,0,0,.35);
  image-rendering:pixelated;transition:transform .08s}
.vbox:hover{transform:translateY(-4px)}
.vbox:active{transform:translateY(1px)}
.vbox .lid{height:20px;background:rgba(255,255,255,.14);border-bottom:2px solid rgba(0,0,0,.3);position:relative}
.vbox .lid::after{content:"";position:absolute;left:50%;top:7px;transform:translateX(-50%);width:26px;height:5px;background:rgba(0,0,0,.3)}
.vbox .plate{position:absolute;left:8px;right:8px;top:40px;background:var(--paper);border:2px solid var(--wood-d);padding:7px}
.vbox .plate .n{font-family:'VT323';font-size:17px;line-height:1;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.vbox .plate .c{font-family:'Press Start 2P';font-size:7px;color:var(--wood-d);margin-top:6px;display:flex;justify-content:space-between}
.vbox.add{background:rgba(0,0,0,.25);border:2px dashed var(--paper);display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;color:var(--paper);box-shadow:none}
.vbox.add .p{font-family:'Press Start 2P';font-size:22px}
.vbox.add span{font-family:'Press Start 2P';font-size:8px}

/* card grid */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.pcard{background:var(--paper);border:2px solid var(--ink);position:relative}
.pcard .iw{position:relative;aspect-ratio:59/86;background:#181822;image-rendering:auto}
.pcard img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
.pcback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#8a6a3a,#4a361c 62%,#2e2211);}
.pcback .r{width:44px;height:44px;border:2px solid rgba(240,220,160,.5);border-radius:50%;color:rgba(240,220,160,.7);
  display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P';font-size:12px}
.pcard .q{position:absolute;top:4px;right:4px;font-family:'Press Start 2P';font-size:8px;background:var(--ink);color:var(--gold);
  padding:3px 5px;border:1px solid var(--gold)}
.pcard .pr{position:absolute;bottom:4px;left:4px;font-family:'Press Start 2P';font-size:7px;background:var(--ink);color:var(--gold);padding:2px 4px;display:none}
.showvalue .pcard .pr{display:block}
.pcard .nm{font-family:'VT323';font-size:16px;line-height:1;padding:6px 7px;min-height:38px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .row{display:flex;align-items:center;justify-content:space-between;padding:0 6px 7px;gap:5px}
.step{display:flex;align-items:center;border:2px solid var(--ink)}
.step button{background:var(--paper);border:none;width:24px;height:24px;font-family:'Press Start 2P';font-size:10px;color:var(--ink);cursor:pointer}
.step button:active{background:var(--gold)}
.step .qn{font-family:'Press Start 2P';font-size:8px;min-width:22px;text-align:center}
.pcard .mr{background:var(--paper);border:2px solid var(--ink);font-family:'Press Start 2P';font-size:8px;padding:3px 6px;cursor:pointer}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.rin{font-family:'VT323';font-size:18px;padding:6px 10px;background:#fff;border:2px solid var(--ink);color:var(--ink);min-width:0}
.rin:focus{outline:none;background:#fffde8}
.rsel{font-family:'Press Start 2P';font-size:8px;padding:8px;background:#fff;border:2px solid var(--ink);color:var(--ink);cursor:pointer}
.swrow{display:flex;gap:5px}
.sw{width:22px;height:22px;border:2px solid var(--ink);cursor:pointer}
.sw.sel{outline:3px solid var(--gold);outline-offset:1px}

/* menu list (pokemon style) */
.menu{position:fixed;z-index:60;background:var(--paper);border:3px solid var(--ink);
  box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--ink),4px 6px 0 rgba(0,0,0,.4);display:none;min-width:190px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:var(--paper);border:none;
  font-family:'VT323';font-size:19px;color:var(--ink);padding:8px 12px 8px 22px;cursor:pointer;position:relative}
.menu button:hover{background:#fffde8}
.menu button:hover::before{content:"▶";position:absolute;left:7px;font-size:12px}
.menu .hd{font-family:'Press Start 2P';font-size:8px;padding:9px 12px 4px;color:var(--ink2)}
.menu .sp{height:3px;background:var(--paper-sh);margin:4px 0}
.menu button.warn{color:var(--red)}

/* fields */
.field{margin-bottom:14px}
.field label{font-family:'Press Start 2P';font-size:8px;display:block;margin-bottom:6px;color:var(--ink2)}
.field .rin{width:100%;font-size:18px}
.hint{font-family:'VT323';font-size:17px;color:var(--ink2);line-height:1.3}
.drop{border:3px dashed var(--ink);padding:26px 16px;text-align:center;cursor:pointer;background:#fff}
.drop.hot{background:#fffbe0}
.drop .big{font-size:34px}
.maptable{width:100%;border-collapse:collapse;font-family:'VT323';font-size:18px}
.maptable td{padding:5px 6px;border-top:2px solid var(--paper-sh)}
.maptable .k{font-family:'Press Start 2P';font-size:8px}
.maptable select{width:100%;font-family:'VT323';font-size:17px;padding:5px;border:2px solid var(--ink);background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{font-family:'VT323';font-size:17px;padding:7px 11px;border:2px solid var(--ink);cursor:pointer;background:#fff}
.chip.sel{background:var(--gold)}

.detail{display:flex;gap:16px;flex-wrap:wrap}
.detail{justify-content:center}
.detail .bi{width:330px;max-width:82vw;aspect-ratio:59/86;background:#181822;border:2px solid var(--ink);flex:none}
.detail .bi img{width:100%;height:100%;object-fit:cover}
.detail .info{flex:1;min-width:180px;font-family:'VT323';font-size:19px}
.kv{display:flex;padding:5px 0;border-bottom:2px solid var(--paper-sh)}
.kv .k{font-family:'Press Start 2P';font-size:8px;width:110px;flex:none;color:var(--ink2);padding-top:3px}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:120;
  font-family:'Press Start 2P';font-size:8px;background:var(--ink);color:var(--paper);
  padding:11px 14px;border:2px solid var(--paper);box-shadow:3px 3px 0 rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center;line-height:1.5}
.toast.show{opacity:1}
.loadbar{position:fixed;top:0;left:0;height:4px;background:var(--gold);width:0;z-index:130;transition:width .3s}
#needs{position:absolute;top:26px;left:6px;z-index:6;display:flex;flex-direction:column;gap:3px;padding:4px 5px;background:rgba(18,18,36,.55);border:1px solid rgba(255,255,255,.15)}
#needs .need{display:flex;align-items:center;gap:4px}
#needs .ic{font-size:9px;width:11px;text-align:center;line-height:1}
#needs .bar{width:52px;height:6px;background:#0c0c1a;border:1px solid rgba(255,255,255,.25)}
#needs .fill{display:block;height:100%}
#fade{position:absolute;inset:0;background:#0a0a14;opacity:0;pointer-events:none;transition:opacity .4s;z-index:8}
#fade.on{opacity:1}
</style>
</head>
<body>

<div id="stage">
  <div id="screen">
    <canvas id="game" width="224" height="192"></canvas>
    <div id="hud"><span class="l" id="hudTitle">NICK'S COLLECTION</span><span class="r" id="hudCount"></span></div>
    <div id="needs"></div>
    <div id="fade"></div>
    <div id="prompt" class="pixel"></div>
  </div>
</div>

<div id="controls">
  <div class="dpad">
    <button class="u" data-d="up">▲</button>
    <button class="l" data-d="left">◀</button>
    <span class="c"></span>
    <button class="r" data-d="right">▶</button>
    <button class="d" data-d="down">▼</button>
  </div>
  <div class="abbtns">
    <button class="b" id="btnB">B</button>
    <button class="a" id="btnA">A</button>
  </div>
</div>

<!-- shelf overlay -->
<div class="overlay" id="shelfOverlay">
  <div class="win">
    <div class="win-title pixel">CARD SHELF <span class="sp"><button class="rbtn x" id="shelfMenu">☰</button><button class="rbtn x red" id="shelfClose">✕</button></span></div>
    <div class="win-body">
      <div class="stat-strip" id="shelfStats"></div>
      <div class="bookcase" id="bookcase"></div>
    </div>
  </div>
</div>

<!-- box (cards) overlay -->
<div class="overlay" id="boxOverlay">
  <div class="win">
    <div class="win-title pixel"><span id="boxTitle">BOX</span><span class="sp"><button class="rbtn x" id="boxMenu">⋯</button><button class="rbtn x red" id="boxClose">✕</button></span></div>
    <div class="win-body">
      <div class="stat-strip" id="boxStats"></div>
      <div class="tools">
        <input class="rin" id="boxSearch" placeholder="find..." style="flex:1;min-width:110px">
        <select class="rsel" id="boxSort">
          <option value="name">A-Z</option>
          <option value="qtyd">MOST</option>
          <option value="qtya">FEWEST</option>
          <option value="type">TYPE</option>
          <option value="valued">VALUE</option>
        </select>
        <button class="rbtn sm blue" id="addCardBtn">+CARD</button>
      </div>
      <div class="swrow" id="boxSwatches" style="margin-bottom:14px"></div>
      <div class="cardgrid" id="cardgrid"></div>
    </div>
  </div>
</div>

<!-- generic modal -->
<div class="overlay" id="modal">
  <div class="win sm" id="dialog">
    <div class="win-title pixel"><span id="dlgTitle"></span><span class="sp"><button class="rbtn x red" id="dlgClose">✕</button></span></div>
    <div class="win-body" id="dlgBody"></div>
    <div class="win-foot" id="dlgFoot"></div>
  </div>
</div>

<div class="menu" id="popMenu"></div>
<div class="toast" id="toast"></div>
<div class="loadbar" id="loadbar"></div>

<script>
"use strict";
/* =========================================================================
   THE COLLECTION — Card Room
   A Pokemon-style room you walk around. Walk to the bookcase (press A / tap)
   to open your card shelf; open a box to see the cards. The PC on the desk
   handles importing spreadsheets and backups (like Bill's PC).

   Card data: YGOPRODeck (db.ygoprodeck.com), downloaded once & cached in
   IndexedDB, matched locally. Collection saved in localStorage.
   ========================================================================= */

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const money=n=>'$'+(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const norm=s=>(s||'').toString().toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const escapeHtml=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const IMG=id=>`https://images.ygoprodeck.com/images/cards_small/${id}.jpg`;
const IMG_LG=id=>`https://images.ygoprodeck.com/images/cards/${id}.jpg`;
const BOX_COLORS=['#7a4a3a','#3f5e50','#4a4a6a','#6a5a3a','#5a3a4a','#3a5a6a','#6a4657','#41684a','#5c4a68','#6b5330'];
let toastTimer;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
function loadbar(p){const b=$('#loadbar');if(p<=0){b.style.width='0';return;}b.style.width=Math.min(100,p*100)+'%';if(p>=1)setTimeout(()=>b.style.width='0',400);}

let state={boxes:[],settings:{showValue:true}};
const STORE_KEY='nick-collection-v1';
function load(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY));if(s&&s.boxes){state=Object.assign(state,s);return;}}catch(e){}if(typeof NICK_SEED!=='undefined'&&NICK_SEED.length){state.boxes=JSON.parse(JSON.stringify(NICK_SEED));save();}}

/* =========================================================================
   Card database
   ========================================================================= */
let cardIndex=null,idIndex=null,dbReady=false;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ygoCardDB',1);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};
  r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error);});}
function idbGet(k){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);}));}
function idbSet(k,v){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);}));}
function buildIndex(slim){cardIndex=new Map();idIndex=new Map();for(const c of slim){if(!cardIndex.has(c.n))cardIndex.set(c.n,c);idIndex.set(c.i,c);}dbReady=true;}
async function ensureCardDB(){
  if(dbReady)return true;
  try{const cached=await idbGet('cards');if(cached&&cached.length)buildIndex(cached);}catch(e){}
  try{
    let remoteVer=null;
    try{const v=await fetch('https://db.ygoprodeck.com/api/v7/checkDBVer.php').then(r=>r.json());remoteVer=v&&v[0]&&v[0].database_version;}catch(e){}
    const localVer=await idbGet('ver').catch(()=>null);
    if(dbReady&&(!remoteVer||remoteVer===localVer))return true;
    toast('Downloading card database...');loadbar(0.15);
    const data=await fetch('https://db.ygoprodeck.com/api/v7/cardinfo.php').then(r=>r.json());loadbar(0.7);
    if(!data||!data.data)throw new Error('bad');
    const slim=data.data.map(c=>{let p=0;const pr=c.card_prices&&c.card_prices[0];
      if(pr)p=parseFloat(pr.tcgplayer_price)||parseFloat(pr.cardmarket_price)||parseFloat(pr.ebay_price)||0;
      return{i:(c.card_images&&c.card_images[0]&&c.card_images[0].id)||c.id,n:norm(c.name),dn:c.name,t:c.type,r:c.race,a:c.attribute,p};});
    buildIndex(slim);await idbSet('cards',slim);if(remoteVer)await idbSet('ver',remoteVer);loadbar(1);return true;
  }catch(e){loadbar(1);if(dbReady)return true;toast('No card DB - showing labels only');return false;}
}
function resolveByName(name){if(!cardIndex)return null;const q=norm(name);if(!q)return null;
  if(cardIndex.has(q))return cardIndex.get(q);
  const np=q.replace(/\s*\([^)]*\)\s*/g,' ').trim();if(np&&cardIndex.has(np))return cardIndex.get(np);
  for(const[k,v]of cardIndex){if(k.startsWith(q)||q.startsWith(k))return v;}return null;}
function resolveById(id){id=parseInt(id,10);return idIndex&&idIndex.has(id)?idIndex.get(id):null;}
function enrich(c){let r=null;if(c.cardId)r=resolveById(c.cardId);if(!r&&c.name)r=resolveByName(c.name);
  if(r){c.cardId=r.i;c.type=r.t;c.race=r.r;c.attribute=r.a;c.price=r.p;if(r.dn&&!c.name)c.name=r.dn;}return c;}
async function enrichAll(){await ensureCardDB();if(!dbReady)return;for(const b of state.boxes)for(const c of b.cards)enrich(c);save();}

/* totals */
function boxTotals(b){let count=0,value=0;for(const c of b.cards){const q=c.qty||1;count+=q;value+=(c.price||0)*q;}return{count,value,unique:b.cards.length};}
function grandTotals(){let cards=0,unique=0,value=0;for(const b of state.boxes){const t=boxTotals(b);cards+=t.count;unique+=t.unique;value+=t.value;}return{cards,unique,value,boxes:state.boxes.length};}

const cv=$('#game'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const T=16, COLS=14, ROWS=12;

// map: W wall, . floor, C cabinet(shelf), D desk/pc, R rug, P plant, W_ window
const MAP=[
 "WWWWWWWWWWWWWW",
 "W..CCCCCC..FFW",
 "W..CCCCCC...GW",
 "W.D..........W",
 "W.D..RRRR....W",
 "W....RRRR...VW",
 "W....RRRR....W",
 "WT...........W",
 "W.UU......BB.W",
 "W.........BB.W",
 "W...P...P....W",
 "WWWWWWWWWWWWWW",
];
function tileAt(c,r){if(r<0||r>=ROWS||c<0||c>=COLS)return 'W';return MAP[r][c];}
function solid(c,r){const t=tileAt(c,r);return !(t==='.'||t==='R');}

const player={tx:2,ty:6,px:2*T,py:6*T,dir:'down',moving:false,frame:0,animt:0,bob:0};

/* ---- pixel drawing ---- */
function R(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x|0,y|0,w|0,h|0);}
function drawFloorTile(c,r){
  const x=c*T,y=r*T;
  // wood planks
  R(x,y,T,T,(c+r)%2? '#b5854f':'#a9793f');
  R(x,y+T-1,T,1,'#8a6432');
  R(x,y,1,T,'#c49560');
}
function drawWall(c,r){
  const x=c*T,y=r*T;
  R(x,y,T,T,'#6b5b8a');
  R(x,y,T,2,'#7d6da0');
  R(x,y+T-3,T,3,'#544578');
  // wainscot line on lower walls
}
function cells(ch){const o=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(MAP[r][c]===ch)o.push([c,r]);return o;}
function bbox(ch){const cs=cells(ch);if(!cs.length)return null;let a=99,b=99,x=-1,y=-1;for(const[c,r]of cs){a=Math.min(a,c);b=Math.min(b,r);x=Math.max(x,c);y=Math.max(y,r);}return{x:a*T,y:b*T,w:(x-a+1)*T,h:(y-b+1)*T};}
function drawCabinet(){const bb=bbox('C');if(!bb)return;const {x,y,w,h}=bb;
  R(x,y,w,h,'#7a4a2a');R(x,y,w,2,'#9a643a');R(x,y,2,h,'#9a643a');R(x+w-2,y,2,h,'#4a2c14');R(x,y+h-3,w,3,'#4a2c14');
  R(x+2,y+h/2-1,w-4,2,'#4a2c14');
  const per=6, arr=state.boxes.slice(0,12);
  arr.forEach((bx0,i)=>{const row=Math.floor(i/per),col=i%per;const bx=x+4+col*((w-8)/per),by=y+3+row*((h-6)/2);const bw=((w-8)/per)-2,bh=((h-6)/2)-2;R(bx,by,bw,bh,bx0.color||'#6a4a3a');R(bx,by,bw,2,'rgba(255,255,255,.25)');});}
function drawDesk(){const bb=bbox('D');if(!bb)return;const {x,y,w,h}=bb;
  R(x,y,w,h,'#8a5a3a');R(x,y,2,h,'#a5734a');R(x,y+h-3,w,3,'#5a3418');
  R(x+3,y+3,w-6,9,'#cfd6e0');R(x+4,y+4,w-8,6,'#3b6ea5');R(x+6,y+13,4,3,'#9aa2b0');}
function drawFridge(){const bb=bbox('F');if(!bb)return;const {x,y,w,h}=bb;
  R(x,y,w,h,'#dfe6ee');R(x,y,w,2,'#f2f6fa');R(x+w-2,y,2,h,'#b8c2cc');R(x,y+h-2,w,2,'#a9b3bd');
  R(x,y+Math.floor(h/2)-1,w,2,'#b8c2cc');R(x+w-5,y+3,2,4,'#8a95a0');R(x+w-5,y+Math.floor(h/2)+2,2,4,'#8a95a0');}
function drawGrill(){for(const[c,r]of cells('G')){const x=c*T,y=r*T;
  R(x+3,y+11,2,4,'#333');R(x+11,y+11,2,4,'#333');
  R(x+2,y+7,12,5,'#2a2a2a');R(x+2,y+7,12,1,'#454545');R(x+3,y+6,10,1,'#777');
  R(x+2,y+2,12,3,'#141414');R(x+2,y+2,12,1,'#333');R(x+7,y+1,2,2,'#555');
  R(x+4,y+8,2,2,'#e0632a');R(x+8,y+8,2,2,'#f0a020');R(x+6,y+9,2,1,'#e0632a');
  if(cookingUntil>performance.now()){R(x+5,y+5,6,3,'#7a3b28');R(x+5,y+5,6,1,'#a0512e');}}}
function drawVending(){for(const[c,r]of cells('V')){const x=c*T,y=r*T;
  R(x+1,y,14,16,'#b5483a');R(x+1,y,14,2,'#d05a48');R(x+1,y+14,14,2,'#7a2e24');
  R(x+2,y+2,8,10,'#1a1a30');
  const pal=['#e6b422','#4fbf59','#3b6ea5','#e05a5a','#d0d0d0','#b060c0'];
  for(let iy=0;iy<3;iy++)for(let ix=0;ix<2;ix++){R(x+3+ix*3,y+3+iy*3,2,2,pal[iy*2+ix]);}
  R(x+11,y+2,3,7,'#151530');R(x+11,y+3,2,1,'#7f8');R(x+11,y+5,2,1,'#7f8');R(x+2,y+13,9,2,'#151530');}}
function drawTV(){for(const[c,r]of cells('T')){const x=c*T,y=r*T;
  R(x+1,y+2,14,10,'#111');
  const t=performance.now()/400;R(x+2,y+3,12,8,'#284a70');
  R(x+3,y+4,5,3,(Math.sin(t)>0)?'#7fd0ff':'#5aa0d0');R(x+8,y+7,4,3,(Math.cos(t)>0)?'#ffd27f':'#e0a860');
  R(x+6,y+12,4,2,'#333');R(x+4,y+14,8,1,'#333');}}
function drawCouch(){const bb=bbox('U');if(!bb)return;const {x,y,w,h}=bb;
  R(x,y+2,w,4,'#4f7eb5');R(x,y+4,w,h-4,'#3f6ea5');R(x,y+4,3,h-6,'#4f7eb5');R(x+w-3,y+4,3,h-6,'#4f7eb5');R(x+3,y+8,w-6,1,'#35608f');}
function drawBed(){const bb=bbox('B');if(!bb)return;const {x,y,w,h}=bb;
  R(x,y,w,h,'#6a4a2a');R(x+1,y+1,w-2,h-2,'#e2e2ec');R(x+2,y+2,w-4,4,'#ffffff');
  R(x+1,y+Math.floor(h/2),w-2,h-Math.floor(h/2)-1,'#c05043');R(x+1,y+Math.floor(h/2),w-2,2,'#d0605a');}
function drawPlant(c,r){
  const x=c*T,y=r*T;R(x+4,y+9,8,6,'#b5854f');R(x+4,y+9,8,2,'#c99a6a');
  R(x+5,y+2,6,8,'#3f8a4a');R(x+3,y+5,4,4,'#4fa055');R(x+9,y+5,4,4,'#4fa055');R(x+6,y,4,5,'#57b05f');
}
function drawRug(){const bb=bbox('R');if(!bb)return;const {x,y,w,h}=bb;
  R(x,y,w,h,'#c05043');R(x+2,y+2,w-4,h-4,'#a83b30');R(x+5,y+5,w-10,h-10,'#c05043');}
function drawSmoke(){const cs=cells('G');if(!cs.length)return;const[c,r]=cs[0];const x=c*T,y=r*T;
  const t=performance.now()/150;ctx.fillStyle='rgba(225,225,225,.5)';
  for(let i=0;i<4;i++){const p=(t+i*3)%13;ctx.fillRect((x+5+((i*2)%5))|0,(y+2-p)|0,2,2);}}
function drawPlumbob(){const m=mood();const col=m>66?'#4fbf59':m>33?'#e6c020':'#d8483a';
  const cx=player.px+8, cy=player.py-7+Math.sin(performance.now()/300);
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(cx,cy-3);ctx.lineTo(cx+3,cy);ctx.lineTo(cx,cy+3);ctx.lineTo(cx-3,cy);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(cx-1,cy-1,1,1);}
function drawPlayer(){
  const x=player.px, y=player.py - player.bob;
  const hair='#3a2416',skin='#e8b890',shirt='#d8483a',pants='#34406a',shoe='#20233a';
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x+4,y+15,8,2);
  const f=player.frame;
  R(x+4,y+11,3,4,pants);R(x+9,y+11,3,4,pants);
  if(player.moving){ if(f){R(x+4,y+14,3,1,shoe);R(x+9,y+13,3,2,shoe);} else {R(x+4,y+13,3,2,shoe);R(x+9,y+14,3,1,shoe);} }
  else {R(x+4,y+14,3,1,shoe);R(x+9,y+14,3,1,shoe);}
  R(x+3,y+7,10,5,shirt);R(x+3,y+7,10,1,'#ec6a5c');
  R(x+3,y+1,10,6,skin);
  R(x+3,y,10,2,hair);R(x+3,y+1,1,3,hair);R(x+12,y+1,1,3,hair);
  if(player.dir==='down'){R(x+5,y+4,2,2,'#20204a');R(x+9,y+4,2,2,'#20204a');}
  else if(player.dir==='up'){R(x+3,y+1,10,4,hair);}
  else if(player.dir==='left'){R(x+3,y+1,7,4,hair);R(x+4,y+4,2,2,'#20204a');R(x+3,y+3,1,3,skin);}
  else if(player.dir==='right'){R(x+6,y+1,7,4,hair);R(x+10,y+4,2,2,'#20204a');R(x+12,y+3,1,3,skin);}
  R(x+2,y+7,1,4,skin);R(x+13,y+7,1,4,skin);
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=MAP[r][c];if(t==='W')drawWall(c,r);else drawFloorTile(c,r);}
  drawRug();drawCabinet();drawDesk();drawFridge();drawGrill();drawVending();drawTV();drawCouch();drawBed();
  for(const[c,r]of cells('P'))drawPlant(c,r);
  if(cookingUntil>performance.now())drawSmoke();
  drawPlayer();drawPlumbob();
}

/* ---- movement ---- */
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function tryStep(dir){
  player.dir=dir;
  const[dx,dy]=DIRV[dir];
  const nx=player.tx+dx, ny=player.ty+dy;
  if(solid(nx,ny))return false;
  player.moving=true;player.startx=player.px;player.starty=player.py;
  player.tx=nx;player.ty=ny;player.targetx=nx*T;player.targety=ny*T;player.animt=0;
  return true;
}
function frontTile(){const[dx,dy]=DIRV[player.dir];return{c:player.tx+dx,r:player.ty+dy,t:tileAt(player.tx+dx,player.ty+dy)};}

/* BFS pathfinding to a target tile */
function bfs(sc,sr,tc,tr){
  if(sc===tc&&sr===tr)return[];
  const key=(c,r)=>c+','+r;const prev={};const q=[[sc,sr]];prev[key(sc,sr)]=null;
  while(q.length){const[c,r]=q.shift();
    for(const d of['up','down','left','right']){const[dx,dy]=DIRV[d];const nc=c+dx,nr=r+dy;
      if(nc<0||nr<0||nc>=COLS||nr>=ROWS)continue;if(solid(nc,nr))continue;const k=key(nc,nr);
      if(k in prev)continue;prev[k]=[c,r,d];if(nc===tc&&nr===tr){/*build*/const path=[];let cur=[nc,nr,d];
        while(cur){path.unshift(cur[2]);const p=prev[key(cur[0],cur[1])];if(!p)break;cur=p;}return path;}
      q.push([nc,nr]);}}
  return null;
}
function standingSpotFor(c,r){
  // find a walkable neighbor of (c,r); prefer one below (so player faces up into shelf)
  const order=[[0,1,'up'],[1,0,'left'],[-1,0,'right'],[0,-1,'down']];
  for(const[dx,dy,face]of order){const nc=c+dx,nr=r+dy;if(!solid(nc,nr))return{c:nc,r:nr,face};}
  return null;
}
function walkTo(tc,tr,then,faceDir){
  const path=bfs(player.tx,player.ty,tc,tr);
  if(path==null){toast("Can't reach there");return;}
  walkPath=path.slice();pendingAction=then?{fn:then,face:faceDir}:null;
}

/* ---- interaction ---- */
function interact(){if(overlayOpen())return;const a=ACTIONS[frontTile().t];if(a)a.fn();}
function showPrompt(){
  if(overlayOpen()||player.moving||walkPath){$('#prompt').style.display='none';return;}
  const a=ACTIONS[frontTile().t];
  if(a){$('#prompt').textContent='[A] '+a.label;$('#prompt').style.display='block';}
  else $('#prompt').style.display='none';
}

/* ---- loop ---- */
let last=0;
function loop(ts){
  const dt=Math.min(50,ts-last);last=ts;
  // consume walk path
  if(!player.moving){
    if(walkPath&&walkPath.length){tryStep(walkPath.shift());}
    else if(walkPath&&walkPath.length===0){walkPath=null;
      if(pendingAction){if(pendingAction.face)player.dir=pendingAction.face;const fn=pendingAction.fn;pendingAction=null;fn();}}
    else if(!overlayOpen()){
      const d=held.up?'up':held.down?'down':held.left?'left':held.right?'right':null;
      if(d)tryStep(d);
    }
  }
  // animate step
  if(player.moving){
    player.animt+=dt;const dur=140;const k=Math.min(1,player.animt/dur);
    player.px=player.startx+(player.targetx-player.startx)*k;
    player.py=player.starty+(player.targety-player.starty)*k;
    player.bob=Math.sin(k*Math.PI)*1;
    if(k>=1){player.moving=false;player.px=player.targetx;player.py=player.targety;player.bob=0;player.frame^=1;}
  }
  tickNeeds(dt);draw();showPrompt();var _n=$('#needs');if(_n)_n.style.display=overlayOpen()?'none':'';
  requestAnimationFrame(loop);
}

/* ---- input ---- */
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
addEventListener('keydown',e=>{
  if(overlayOpen()){
    if(e.key==='Escape'){e.preventDefault();escapeOverlay();}
    return;
  }
  if(KEYMAP[e.key]){held[KEYMAP[e.key]]=1;e.preventDefault();}
  else if(e.key==='Enter'||e.key===' '||e.key==='z'||e.key==='Z'){interact();e.preventDefault();}
});

  const on=e=>{e.preventDefault();held[d]=1;};const off=e=>{e.preventDefault();held[d]=0;};
  b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off);b.addEventListener('touchcancel',off);
  b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);

// tap on the game screen -> walk there / to object
cv.addEventListener('click',e=>{
  if(overlayOpen())return;
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*cv.width;
  const y=(e.clientY-rect.top)/rect.height*cv.height;
  const c=Math.floor(x/T),r=Math.floor(y/T);const t=tileAt(c,r);
  if(ACTIONS[t]){const s=standingSpotFor(c,r);if(s)walkTo(s.c,s.r,ACTIONS[t].fn,s.face);}
  else if(!solid(c,r)){walkTo(c,r);}
});

    const m=b.cards.find(x=>(x.cardId&&x.cardId===card.cardId)||(norm(x.name)===norm(card.name)&&x.setCode===card.setCode));
    if(m)m.qty=(m.qty||1)+card.qty;else b.cards.push(card);save();closeModal();afterCardChange();};
},[{label:'CANCEL',fn:closeModal},{label:'ADD',cls:'blue',fn:()=>$('#dlgBody')._doIt()}]);}

/* =========================================================================
   Import (CSV / Excel)  — reached via the PC
   ========================================================================= */
const FIELD_DEFS=[
  {key:'name',label:'Card name',match:/^(card ?name|name|card|title)$/i,alt:/name|card|title/i,required:true},
  {key:'qty',label:'Quantity',match:/^(qty|quantity|count|copies|amount|owned|have|#)$/i,alt:/qty|quant|count|cop|amount|owned|have|number/i},
  {key:'box',label:'Box / location',match:/^(box|location|bin|binder|folder|storage|shelf|slot|place)$/i,alt:/box|location|bin|binder|folder|storage|shelf|slot|where|place/i},
  {key:'cardId',label:'Passcode / ID',match:/^(passcode|password|id|card ?id|konami ?id)$/i,alt:/passcode|password|konami/i},
  {key:'setCode',label:'Set code',match:/^(set ?code|code|number|card ?number)$/i,alt:/set ?code|^code$/i},
  {key:'set',label:'Set name',match:/^(set|set ?name|edition|expansion)$/i,alt:/set ?name|edition|expansion/i},
  {key:'rarity',label:'Rarity',match:/^(rarity|rare)$/i,alt:/rarity|rare/i},
  {key:'condition',label:'Condition',match:/^(condition|cond|grade|quality)$/i,alt:/condition|cond|grade|quality/i},
];
function importDialog(){openModal('IMPORT',({body})=>{
  body.innerHTML=`<div class="drop" id="drop"><div class="big">📄</div>
    <div class="pixel" style="font-size:8px;margin:8px 0">DROP CSV / EXCEL</div>
    <div class="hint">or tap to choose. You'll line up the columns next.</div>
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.tsv" style="display:none"></div>`;
  const drop=$('#drop'),fi=$('#fileInput');drop.onclick=()=>fi.click();
  fi.onchange=()=>fi.files[0]&&readFile(fi.files[0]);
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot');}));
  drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readFile(f);});
},[{label:'CANCEL',fn:closeModal}]);}
function readFile(file){const name=file.name.toLowerCase();
  if(name.endsWith('.csv')||name.endsWith('.tsv')){Papa.parse(file,{header:true,skipEmptyLines:true,complete:r=>mappingStep(r.meta.fields||[],r.data)});}
  else{const reader=new FileReader();reader.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    mappingStep(rows.length?Object.keys(rows[0]):[],rows);};reader.readAsArrayBuffer(file);}}
function autoMap(headers){const map={},used=new Set();
  for(const def of FIELD_DEFS){let hit=headers.find(h=>def.match.test((h||'').trim())&&!used.has(h));
    if(!hit&&def.alt)hit=headers.find(h=>def.alt.test((h||'').trim())&&!used.has(h));
    if(hit){map[def.key]=hit;used.add(hit);}}return map;}
function mappingStep(headers,rows){headers=headers.filter(h=>h!=null&&h!=='');
  if(!headers.length){toast('No columns found');return;}
  const map=autoMap(headers);
  openModal('MATCH COLUMNS',({body})=>{$('#dialog').style.maxWidth='680px';
    let html=`<div class="hint" style="margin-bottom:12px">${rows.length} rows, ${headers.length} columns. Line them up:</div>
      <table class="maptable"><tbody>`;
    for(const def of FIELD_DEFS){html+=`<tr><td class="k">${def.label}${def.required?' *':''}</td>
      <td><select data-k="${def.key}"><option value="">-none-</option>${headers.map(h=>`<option value="${escapeHtml(h)}" ${map[def.key]===h?'selected':''}>${escapeHtml(h)}</option>`).join('')}</select></td></tr>`;}
    html+=`</tbody></table>
      <div class="field" style="margin-top:16px"><label>Make boxes how?</label>
      <div class="chips" id="gm"><div class="chip sel" data-m="auto">By box column</div><div class="chip" data-m="one">All in one box</div></div></div>
      <div class="field" id="oneField" style="display:none"><label>Box name</label><input class="rin" id="oneName" value="Imported collection"></div>
      <div class="hint" id="mapNote"></div>`;
    body.innerHTML=html;
    const sel=()=>body.querySelector('#gm .chip.sel').dataset.m;
    body.querySelectorAll('#gm .chip').forEach(ch=>ch.onclick=()=>{body.querySelectorAll('#gm .chip').forEach(c=>c.classList.remove('sel'));ch.classList.add('sel');
      $('#oneField').style.display=ch.dataset.m==='one'?'block':'none';note();});
    function note(){const boxCol=body.querySelector('[data-k=box]').value;const n=$('#mapNote');
      n.textContent=(sel()==='auto'&&!boxCol)?'! Pick a box column, or choose "All in one box".':'';}
    body.querySelector('[data-k=box]').onchange=note;note();
    body._doImport=()=>{const cols={};body.querySelectorAll('select[data-k]').forEach(s=>{if(s.value)cols[s.dataset.k]=s.value;});
      if(!cols.name){toast('Choose the card-name column');return;}
      const mode=sel();if(mode==='auto'&&!cols.box){toast('Pick a box column');return;}
      doImport(rows,cols,mode,mode==='one'?($('#oneName').value.trim()||'Imported collection'):null);};
  },[{label:'BACK',fn:importDialog},{label:'IMPORT',cls:'blue',fn:()=>$('#dlgBody')._doImport()}]);}
async function doImport(rows,cols,mode,oneBoxName){closeModal();await ensureCardDB();
  const getBoxByName=name=>{let b=state.boxes.find(x=>norm(x.name)===norm(name));if(!b)b=makeBox(name);return b;};
  let added=0,imported=0;const targetOne=mode==='one'?getBoxByName(oneBoxName):null;
  for(const row of rows){const name=(row[cols.name]||'').toString().trim();if(!name)continue;
    const boxName=mode==='one'?oneBoxName:((row[cols.box]||'').toString().trim()||'Unsorted');
    const box=mode==='one'?targetOne:getBoxByName(boxName);
    let qty=1;if(cols.qty){const q=parseInt((row[cols.qty]||'').toString().replace(/[^0-9-]/g,''),10);if(!isNaN(q)&&q>0)qty=q;}
    const card=enrich({name,qty,cardId:cols.cardId?parseInt((row[cols.cardId]||'').toString().replace(/[^0-9]/g,''),10)||null:null,
      setCode:cols.setCode?(row[cols.setCode]||'').toString().trim():'',rarity:cols.rarity?(row[cols.rarity]||'').toString().trim():'',
      condition:cols.condition?(row[cols.condition]||'').toString().trim():''});
    const m=box.cards.find(x=>(x.cardId&&card.cardId&&x.cardId===card.cardId&&x.setCode===card.setCode)||(norm(x.name)===norm(card.name)&&x.setCode===card.setCode));
    if(m)m.qty=(m.qty||1)+qty;else box.cards.push(card);imported+=qty;added++;}
  save();renderShelf();openShelf();toast(`Imported ${added} entries (${imported} cards)`);}

/* export / backup */
function download(fn,text,type){const blob=new Blob([text],{type:type||'text/plain'});const a=el('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function exportJSON(){download('collection-backup.json',JSON.stringify(state,null,2),'application/json');toast('Backup saved');}
function importJSON(){const fi=el('input');fi.type='file';fi.accept='.json';
  fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();
    r.onload=e=>{try{const s=JSON.parse(e.target.result);if(s&&s.boxes){state=Object.assign({settings:{showValue:true}},s);save();enrichAll().then(renderShelf);renderShelf();toast('Restored');}}catch(err){toast('Not a valid backup');}};r.readAsText(f);};fi.click();}
function exportCSV(box){const boxes=box?[box]:state.boxes;
  const rows=[['Box','Card name','Quantity','Set code','Rarity','Condition','Passcode','Est value each']];
  for(const b of boxes)for(const c of b.cards)rows.push([b.name,c.name||'',c.qty||1,c.setCode||'',c.rarity||'',c.condition||'',c.cardId||'',c.price||'']);
  const csv=rows.map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n');
  download((box?box.name.replace(/[^\w]+/g,'-'):'full-collection')+'.csv',csv,'text/csv');toast('CSV exported');}

/* =========================================================================
   PC menu (import + system)
   ========================================================================= */
function openPC(){
  showMenuCentered('PC',[
    {label:'Import spreadsheet',fn:importDialog},
    {label:'Open card shelf',fn:openShelf},
    {label:'Add empty box',fn:newBoxDialog},
    {sp:1},
    {label:'Export full collection (CSV)',fn:()=>exportCSV()},
    {label:'Save backup (JSON)',fn:exportJSON},
    {label:'Restore backup (JSON)',fn:importJSON},
    {sp:1},
    {label:(state.settings.showValue?'Hide':'Show')+' card values',fn:()=>{state.settings.showValue=!state.settings.showValue;save();if(currentBoxId){renderBoxHeader();renderCards();}renderShelf();}},
    {label:'Refresh card database',fn:async()=>{dbReady=false;await idbSet('ver',null);await ensureCardDB();await enrichAll();toast('Card DB refreshed');}},
    {sp:1},
    {label:"Reset shelf to Nick's collection",fn:()=>{if(confirm("Reset the shelf back to Nick's imported collection? This clears any changes you've made here.")){state.boxes=JSON.parse(JSON.stringify(NICK_SEED));save();renderShelf();if(currentBoxId)closeBox();toast("Reset to Nick's collection");}}},
    {sp:1},
    {label:'Close',fn:closeMenu},
  ]);
}
function appMenu(e){openPC();}
function showMenuCentered(title,items){
  const m=$('#popMenu');m.innerHTML='';m.appendChild(el('div','hd',title));
  for(const it of items){if(it.sp){m.appendChild(el('div','sp'));continue;}
    const b=el('button',it.warn?'warn':null,it.label);b.onclick=()=>{closeMenu();it.fn&&it.fn();};m.appendChild(b);}
  m.classList.add('open');
  const r=m.getBoundingClientRect();
  m.style.left=Math.max(8,(innerWidth-r.width)/2)+'px';
  m.style.top=Math.max(8,(innerHeight-r.height)/2)+'px';
}

/* =========================================================================
   Boot
   ========================================================================= */
load();ensureSim();renderNeeds();fit();requestAnimationFrame(loop);updateHud();
ensureCardDB().then(()=>{if(state.boxes.length)enrichAll().then(()=>{updateHud();if(currentBoxId)renderCards();if($('#shelfOverlay').classList.contains('open'))renderShelf();});});
</script>
